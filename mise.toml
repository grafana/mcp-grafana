# Tool versions and dev tasks. `mise install` sets up the tools, `mise tasks`
# lists the tasks, `mise run <task>` runs one. https://mise.jdx.dev/
#
# Not pinned here on purpose:
# - Go's minimum lives in go.mod; GOTOOLCHAIN downloads it if the go below is older.
# - Python is pinned in tests/.python-version, and uv installs it.
# - The Dockerfile base images are bumped by Renovate separately.

min_version = "2026.9.0"

[tools]
go = "1.26"
golangci-lint = "2.14.0"
goreleaser = "2.18.3"
node = "24"
uv = "0.13.4"
"github:sd2k/mcp-tokens" = "0.2.5"

[vars]
enabled_tools = "search,datasource,incident,prometheus,loki,elasticsearch,influxdb,alerting,dashboard,folder,oncall,asserts,sift,pyroscope,navigation,tempo,annotations,rendering,admin,clickhouse,cloudwatch,athena"
# Note: influxdb is opt-in for end users (like clickhouse/cloudwatch/elasticsearch)
# but included in the run tasks so local development exercises the code.

# =============================================================================
# BUILD
# =============================================================================

[tasks.build]
description = "Build the binary"
run = "go build -o dist/mcp-grafana ./cmd/mcp-grafana"

[tasks.build-image]
description = "Build the Docker image"
run = "docker build -t mcp-grafana:latest ."

[tasks.build-ui]
description = "Rebuild MCP App UI bundles under ui/. The built artifacts are committed for `go:embed`, so this only needs to run when ui/*/src changes"
run = """
#!/usr/bin/env bash
set -euo pipefail
for dir in ui/*/; do
  if [ -f "$dir/package.json" ]; then
    echo "Building $dir..."
    (cd "$dir" && npm ci --ignore-scripts && npm run build)
  fi
done
"""

# =============================================================================
# LINT
# =============================================================================

[tasks.lint]
description = "Run format checks and lint the Go code"
depends = ["lint-gofmt", "lint-jsonschema", "lint-openapi"]
run = [
  "golangci-lint run",
  # lokiguard is a separate Go module, so the run above does not see it.
  "cd lokiguard && golangci-lint run --config ../.golangci.yaml",
]

[tasks.lint-gofmt]
description = "Fail if any Go file is not gofmt-formatted"
run = """
#!/usr/bin/env bash
set -euo pipefail
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "The following files are not formatted with gofmt:"
  echo "$unformatted"
  exit 1
fi
"""

[tasks.lint-jsonschema]
description = "Lint for unescaped commas in jsonschema tags"
run = "go run ./cmd/linters/jsonschema --path ."

[tasks.lint-jsonschema-fix]
description = "Automatically fix unescaped commas in jsonschema tags"
run = "go run ./cmd/linters/jsonschema --path . --fix"

[tasks.lint-openapi]
description = "Lint for openapi client calls missing context propagation"
run = "go run ./cmd/linters/openapi ./tools/... ./"

# =============================================================================
# TEST
# =============================================================================

[tasks.test-unit]
description = "Run the unit tests (no external dependencies required)"
run = [
  "go test -v -tags unit ./...",
  "cd lokiguard && go test -v ./...",
]

[tasks.test]
description = "Alias for test-unit"
depends = ["test-unit"]

[tasks.test-integration]
description = "Run the Docker-based integration tests (start the services first with `mise run run-test-services`)"
run = "go test -v -tags integration ./..."

[tasks.test-cloud]
description = "Run the cloud-based tests (requires GRAFANA_SERVICE_ACCOUNT_TOKEN for the mcptests instance)"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ -z "${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}" ]; then
  if [ -z "${GRAFANA_API_KEY:-}" ]; then
    echo "Neither GRAFANA_SERVICE_ACCOUNT_TOKEN nor GRAFANA_API_KEY is set. Please 'export GRAFANA_SERVICE_ACCOUNT_TOKEN=...' or use a tool like direnv to load it from .envrc. See https://grafana.com/docs/grafana/latest/administration/service-accounts/#add-a-token-to-a-service-account-in-grafana for details on creating service account tokens." >&2
    exit 1
  fi
  echo "GRAFANA_API_KEY is deprecated, please use GRAFANA_SERVICE_ACCOUNT_TOKEN instead" >&2
fi
# The mcptests stack hibernates when idle and returns 503 on every endpoint while it wakes.
# curl retries 503s as transient errors, so this blocks until the stack is up (max 10m).
curl -fsS -o /dev/null --retry 60 --retry-delay 10 --retry-max-time 600 \
  -H "Authorization: Bearer ${GRAFANA_SERVICE_ACCOUNT_TOKEN:-$GRAFANA_API_KEY}" \
  https://mcptests.grafana-dev.net/api/frontend/settings
GRAFANA_URL=https://mcptests.grafana-dev.net go test -v -count=1 -tags cloud ./tools
GRAFANA_URL=https://mcptests.grafana-dev.net go test -v -count=1 -tags cloud -run TestToolPermissions ./cmd/mcp-grafana
"""

[tasks.test-python-e2e]
description = "Run the deterministic Python E2E tests, no LLM involved (start the services and SSE server first with `mise run run-test-services` and `mise run run-sse`)"
dir = "tests"
env = { GRAFANA_USERNAME = "admin", GRAFANA_PASSWORD = "admin" }
run = ["uv sync --all-groups", "uv run pytest -m 'not llm'"]

[tasks.test-python-llm]
description = "Run the Python LLM evals (as test-python-e2e, plus OPENAI_API_KEY and ANTHROPIC_API_KEY)"
dir = "tests"
env = { GRAFANA_USERNAME = "admin", GRAFANA_PASSWORD = "admin" }
run = ["uv sync --all-groups", "uv run pytest -m llm"]

[tasks.run-test-services]
description = "Run the docker-compose services required for the integration and E2E tests"
run = "docker-compose up -d --build"

# =============================================================================
# RUN
# =============================================================================

[tasks.run]
description = "Run the MCP server in stdio mode"
env = { GRAFANA_USERNAME = "admin", GRAFANA_PASSWORD = "admin" }
run = "go run ./cmd/mcp-grafana --enabled-tools {{vars.enabled_tools}}"

[tasks.run-sse]
description = "Run the MCP server in SSE mode"
env = { GRAFANA_USERNAME = "admin", GRAFANA_PASSWORD = "admin", OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4317", OTEL_EXPORTER_OTLP_INSECURE = "true" }
run = "go run ./cmd/mcp-grafana --transport sse --log-level debug --debug --metrics --enabled-tools {{vars.enabled_tools}}"

[tasks.run-streamable-http]
description = "Run the MCP server in StreamableHTTP mode"
env = { GRAFANA_USERNAME = "admin", GRAFANA_PASSWORD = "admin", OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4317", OTEL_EXPORTER_OTLP_INSECURE = "true" }
run = "go run ./cmd/mcp-grafana --transport streamable-http --log-level debug --debug --metrics --enabled-tools {{vars.enabled_tools}}"

# =============================================================================
# TOKEN ANALYSIS
# =============================================================================

[tasks.token-baseline]
description = "Generate a token baseline for the MCP server"
depends = ["build"]
run = "mcp-tokens analyze --format json --all-providers --output baseline.json -- ./dist/mcp-grafana"

[tasks.token-check]
description = "Compare token usage against the baseline"
depends = ["build"]
run = "mcp-tokens analyze --baseline baseline.json --threshold-percent 5 -- ./dist/mcp-grafana"
