name: Stale issues and pull requests

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
      pull-requests: write
    steps:
      - name: Process stale issues and pull requests
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 90
          days-before-issue-close: 90
          stale-issue-label: stale
          exempt-issue-labels: security,keep-open
          stale-issue-message: >-
            This issue has had no activity for 90 days. Update it or ask a
            maintainer to apply the keep-open label. Otherwise, it will close in
            90 days.
          close-issue-message: >-
            This issue was closed after approximately six months without activity.
          close-issue-reason: not_planned
          days-before-pr-stale: 14
          days-before-pr-close: 14
          stale-pr-label: stale
          exempt-pr-labels: security,keep-open
          stale-pr-message: >-
            This pull request has had no activity for 14 days. Update it or ask a
            maintainer to apply the keep-open label. Otherwise, it will close in
            14 days.
          close-pr-message: >-
            This pull request was closed because it remained inactive for 14 days
            after being marked stale.
          remove-pr-stale-when-updated: true
          operations-per-run: 100
