# Posts the Token Analysis result as a pull request comment.
#
# Why this exists as a separate workflow: pull requests from forks get a
# read-only GITHUB_TOKEN, so the analysis job in token-check.yml cannot comment
# no matter what permissions it requests. Until now that meant external
# contributors — the people most likely to be adding a tool — never saw their
# token cost, and neither did reviewers.
#
# workflow_run runs in the context of the base repository, from the workflow
# file on the default branch, with a real token. It deliberately does NOT check
# out or execute any pull request code: it reads one small JSON artifact,
# re-validates every field, and renders the comment itself. Everything from the
# artifact is treated as untrusted input.
name: Token Analysis Comment

# zizmor flags every use of workflow_run as `dangerous-triggers`, because the
# usual mistake is to check out and build the pull request's code in a workflow
# that holds write permissions. This workflow does not do that, and cannot:
#
#   - there is no actions/checkout step, and nothing from the pull request is
#     executed, sourced or interpolated into a shell;
#   - the only input is one JSON artifact, and every field is re-validated in
#     the script below (numbers coerced, tool names filtered to [A-Za-z0-9_.-],
#     failure text stripped of markdown control characters);
#   - the pull request number the artifact names is verified against the
#     triggering run's head SHA before anything is posted, so a fork cannot
#     direct a comment at an unrelated pull request;
#   - permissions are the two needed to read the artifact and post a comment.
#
# The alternative, pull_request_target, would be genuinely unsafe here, since
# the analysis has to build contributor code to measure it.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Token Analysis"]
    types: [completed]

permissions: {}

# Serialise per pull request so a rapid series of pushes can't race two updates
# of the same comment. Deliberately not cancel-in-progress: a cancelled run
# would drop the comment for the run that superseded it.
concurrency:
  group: token-analysis-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  comment:
    name: Post token analysis comment
    runs-on: ubuntu-latest
    # Only fires for runs triggered by a pull request; ignores branch pushes.
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      actions: read # to download the artifact from the triggering run
      pull-requests: write # to post the comment
    steps:
      - name: Download analysis summary
        id: download
        uses: dawidd6/action-download-artifact@09d0677378d50fef230b7cd4c0dea6dfe8883938
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: token-analysis
          path: token-analysis
          if_no_artifact_found: warn

      - name: Post or update comment
        if: steps.download.outputs.found_artifact == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        with:
          script: |
            const fs = require('fs');

            // ---- Read the artifact -------------------------------------------------
            let raw;
            try {
              raw = JSON.parse(fs.readFileSync('token-analysis/summary.json', 'utf8'));
            } catch (err) {
              core.warning(`Could not parse the analysis summary: ${err.message}`);
              return;
            }

            // ---- Validate everything ----------------------------------------------
            // The artifact was produced by a workflow running untrusted pull request
            // code, so nothing in it is trusted. Numbers are coerced, strings are
            // filtered to known-safe shapes, and the PR number is verified against
            // the run that produced it.
            // Note Number('') === 0, so empty and 'null' values must be rejected
            // before coercion — otherwise a run with no baseline yet would report
            // a confident "0 tokens" instead of admitting it has nothing to compare.
            const num = (v) => {
              if (v === null || v === undefined) return null;
              const s = String(v).trim();
              if (s === '' || s.toLowerCase() === 'null') return null;
              const n = Number(s);
              return Number.isFinite(n) ? n : null;
            };

            const prNumber = num(raw.pr);
            if (prNumber === null || !Number.isInteger(prNumber) || prNumber <= 0) {
              core.warning('Summary contained no usable pull request number; nothing to comment on.');
              return;
            }

            // Critical check: a fork controls the artifact contents, so it could name
            // any pull request. Confirm the PR it names is really the one this run
            // was for by matching the head SHA.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.head.sha !== context.payload.workflow_run.head_sha) {
              core.setFailed(
                `Refusing to comment: PR #${prNumber} is at ${pr.head.sha.slice(0, 8)} but the ` +
                `analysis run was for ${context.payload.workflow_run.head_sha.slice(0, 8)}.`
              );
              return;
            }

            // Take pass/fail from the triggering run's conclusion, not from the
            // artifact. token-check.yml fails its job when the threshold is
            // exceeded, so the conclusion is a faithful signal that GitHub owns —
            // whereas a fork could simply write "passed": true into the artifact
            // and have the comment contradict its own red check.
            const passed = context.payload.workflow_run.conclusion === 'success';
            const total = num(raw.total);
            const baseline = num(raw.baseline);
            const diff = num(raw.diff);
            const diffPercent = num(raw.diff_percent);

            // Tool names in this repo are snake_case; filter to that and cap the
            // length so a crafted name can't inject markdown or bloat the comment.
            const safeName = (v) =>
              String(v ?? '').replace(/[^A-Za-z0-9_.-]/g, '').slice(0, 80) || 'unknown';

            const CHANGE_LABELS = {
              added: ':new: Added',
              removed: ':wastebasket: Removed',
              modified: ':pencil2: Modified',
            };

            const changes = Array.isArray(raw.tool_changes) ? raw.tool_changes : [];
            const MAX_SHOWN = 10;

            // ---- Render ------------------------------------------------------------
            const signed = (n) => (n === null ? '?' : `${n > 0 ? '+' : ''}${n}`);
            // Keep one decimal place as a string: Number('4.0') would collapse to 4.
            const percent =
              diffPercent === null
                ? '?'
                : `${diffPercent > 0 ? '+' : ''}${diffPercent.toFixed(1)}`;
            const lines = [
              '## MCP Token Analysis',
              '',
              passed ? ':white_check_mark: **Passed**' : ':x: **Failed**',
              '',
            ];

            if (baseline !== null && total !== null) {
              lines.push(
                '| Metric | Value |',
                '|--------|-------|',
                `| Baseline | ${baseline} tokens |`,
                `| Current | ${total} tokens |`,
                `| Change | ${signed(diff)} (${percent}%) |`,
                ''
              );
            } else if (total !== null) {
              lines.push(`**Total tokens:** ${total}`, '');
            } else {
              lines.push('_Token counts were not available for this run._', '');
            }

            if (!passed && raw.failure_reason) {
              // Strip markdown structure and defuse :emoji: shortcodes, so a crafted
              // reason can't forge a heading or a green tick inside our own comment.
              // A genuine reason ("Token usage increased by 4.6% (limit 5%)") is
              // unaffected by both passes.
              const reason = String(raw.failure_reason)
                .replace(/[`\r\n|<>*_#[\]]/g, ' ')
                .replace(/:([a-z0-9_+-]+):/gi, '$1')
                .replace(/\s+/g, ' ')
                .trim()
                .slice(0, 300);
              if (reason) {
                lines.push(`**Reason:** ${reason}`, '');
              }
            }

            if (changes.length > 0) {
              lines.push('### Tool changes', '', '| Tool | Change | Tokens |', '|------|--------|--------|');
              for (const change of changes.slice(0, MAX_SHOWN)) {
                const type = CHANGE_LABELS[change?.change_type] ?? 'Changed';
                lines.push(`| \`${safeName(change?.name)}\` | ${type} | ${signed(num(change?.diff))} |`);
              }
              if (changes.length > MAX_SHOWN) {
                lines.push('', `_...and ${changes.length - MAX_SHOWN} more tool(s) changed._`);
              }
              lines.push('');
            }

            if (changes.some((c) => c?.change_type === 'added')) {
              lines.push(
                'This pull request adds a tool. Every default-on tool is sent to the model on ' +
                  'every request, so please check [CONTRIBUTING.md](https://github.com/grafana/mcp-grafana/blob/main/CONTRIBUTING.md) ' +
                  'for which tier it should ship in — an opt-in category costs other users nothing.',
                ''
              );
            }

            if (raw.provider === 'tiktoken') {
              lines.push(
                '<sub>Counted with tiktoken, which is approximate. Exact Anthropic counts ' +
                  'need credentials that fork pull requests cannot access.</sub>',
                ''
              );
            }

            const marker = '<!-- mcp-token-analysis -->';
            const body = `${marker}\n${lines.join('\n')}`;

            // ---- Upsert a single sticky comment ------------------------------------
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const mine = existing.find(
              (c) =>
                c.user?.type === 'Bot' &&
                (c.body?.includes(marker) || c.body?.startsWith('## MCP Token Analysis'))
            );

            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mine.id,
                body,
              });
              core.info(`Updated comment ${mine.id} on PR #${prNumber}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info(`Created a comment on PR #${prNumber}.`);
            }
