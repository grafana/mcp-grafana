name: Token Analysis

on:
  pull_request:

permissions: {}

# One analysis per pull request; superseded pushes are cancelled. The comment
# workflow tolerates a cancelled run (no artifact means it does nothing).
concurrency:
  group: token-analysis-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze token usage
    runs-on: ubuntu-latest
    # No pull-requests: write here on purpose. GitHub gives fork pull requests a
    # read-only token regardless of what we ask for, so commenting from this job
    # can never work for external contributors. The comment is posted by
    # token-comment.yml, which runs on workflow_run in the base repo context and
    # consumes only the artifact this job uploads.
    permissions:
      contents: read # to check out the repository
      id-token: write # to authenticate to Vault via OIDC for the Anthropic API key
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build server
        run: make build

      - name: Download baseline
        id: download-baseline
        uses: dawidd6/action-download-artifact@09d0677378d50fef230b7cd4c0dea6dfe8883938
        with:
          branch: main
          name: token-baseline
          path: baseline
          workflow: token-baseline.yml
          if_no_artifact_found: warn

      - name: Get secrets
        id: get-secrets
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: grafana/shared-workflows/actions/get-vault-secrets@a53fc80bc30b0a16a262520465db899fa3af08b7 # get-vault-secrets/v1.3.2
        with:
          # Don't export secrets to $GITHUB_ENV for the whole job; consume them
          # from this step's `secrets` output only where needed (see below).
          export_env: false
          # Secrets placed in the ci/repo/grafana/mcp-grafana/<path> path in Vault
          repo_secrets: |
            ANTHROPIC_API_KEY=anthropic:api-key

      - name: Analyze tokens
        id: analyze
        # Don't fail the step here: we want the summary written and uploaded even
        # when the threshold is exceeded, so the comment still gets posted. The
        # threshold is enforced in the final step instead.
        continue-on-error: true
        uses: sd2k/mcp-tokens-action@014db1a0f233c4559d5b056983855b0b71c99fa2
        with:
          command: ./dist/mcp-grafana
          # On fork PRs the get-secrets step is skipped (its output is empty), so
          # short-circuit to an empty key — matching the prior unset-env behavior.
          # The action falls back to tiktoken, which is accurate enough to review
          # a tool's cost against the 5% threshold.
          anthropic-api-key: ${{ steps.get-secrets.outputs.secrets && fromJSON(steps.get-secrets.outputs.secrets).ANTHROPIC_API_KEY || '' }}
          baseline: ${{ steps.download-baseline.outputs.found_artifact == 'true' && 'baseline/token-baseline.json' || '' }}
          threshold-percent: "5"
          comment: false

      - name: Write summary for the comment job
        if: always()
        # Every value below is passed through the environment rather than
        # interpolated into the script, so tool names and failure text can't be
        # read as shell. The consuming workflow re-validates all of it.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PASSED: ${{ steps.analyze.outputs.passed }}
          PROVIDER: ${{ steps.analyze.outputs.provider }}
          TOTAL: ${{ steps.analyze.outputs.total-tokens }}
          BASELINE: ${{ steps.analyze.outputs.baseline-tokens }}
          DIFF: ${{ steps.analyze.outputs.diff }}
          DIFF_PERCENT: ${{ steps.analyze.outputs.diff-percent }}
          TOOL_CHANGES: ${{ steps.analyze.outputs.tool-changes }}
          FAILURE_REASON: ${{ steps.analyze.outputs.failure-reason }}
        run: |
          set -euo pipefail
          mkdir -p token-analysis

          # tool-changes is a JSON array; fall back to [] if it's absent or
          # malformed so the comment job always gets well-formed input.
          if ! printf '%s' "${TOOL_CHANGES:-}" | jq -e 'type == "array"' >/dev/null 2>&1; then
            TOOL_CHANGES='[]'
          fi

          jq -n \
            --arg pr "${PR_NUMBER:-}" \
            --arg passed "${PASSED:-}" \
            --arg provider "${PROVIDER:-}" \
            --arg total "${TOTAL:-}" \
            --arg baseline "${BASELINE:-}" \
            --arg diff "${DIFF:-}" \
            --arg diff_percent "${DIFF_PERCENT:-}" \
            --arg failure_reason "${FAILURE_REASON:-}" \
            --argjson tool_changes "$TOOL_CHANGES" \
            '{
              pr: $pr,
              passed: $passed,
              provider: $provider,
              total: $total,
              baseline: $baseline,
              diff: $diff,
              diff_percent: $diff_percent,
              failure_reason: $failure_reason,
              tool_changes: $tool_changes
            }' > token-analysis/summary.json

          echo "Wrote summary for PR #${PR_NUMBER:-unknown}:"
          cat token-analysis/summary.json

          # Also render the result into this run's job summary. This needs no
          # permissions and no secrets, so it works on fork pull requests as-is
          # and remains available even if the workflow_run comment is disabled.
          {
            echo "## MCP Token Analysis"
            echo
            if [ "${PASSED:-}" = "true" ]; then
              echo ":white_check_mark: **Passed**"
            else
              echo ":x: **Failed**"
            fi
            echo
            if [ -n "${BASELINE:-}" ] && [ "${BASELINE:-}" != "null" ]; then
              echo "| Metric | Value |"
              echo "|--------|-------|"
              echo "| Baseline | ${BASELINE} tokens |"
              echo "| Current | ${TOTAL:-?} tokens |"
              echo "| Change | ${DIFF:-?} (${DIFF_PERCENT:-?}%) |"
            else
              echo "**Total tokens:** ${TOTAL:-unknown}"
            fi
            echo
            if [ "${PASSED:-}" != "true" ] && [ -n "${FAILURE_REASON:-}" ]; then
              echo "**Reason:** ${FAILURE_REASON}"
              echo
            fi
            if [ "$TOOL_CHANGES" != "[]" ]; then
              echo "### Tool changes"
              echo
              echo "| Tool | Change | Tokens |"
              echo "|------|--------|--------|"
              printf '%s' "$TOOL_CHANGES" | jq -r \
                '.[] | "| `\(.name)` | \(.change_type) | \(.diff) |"'
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v5.0.0
        with:
          name: token-analysis
          path: token-analysis/summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Enforce token threshold
        if: always() && steps.analyze.outputs.passed != 'true'
        env:
          FAILURE_REASON: ${{ steps.analyze.outputs.failure-reason }}
          OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "success" ] && [ -z "${FAILURE_REASON:-}" ]; then
            echo "::error::Token analysis did not complete. See the 'Analyze tokens' step above."
          else
            echo "::error::${FAILURE_REASON:-Token usage exceeded the allowed increase.}"
          fi
          exit 1
