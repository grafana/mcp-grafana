name: Browser E2E Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # Push filtering compares against the previous commit locally;
          # PR filtering uses the API and only needs a shallow checkout.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: filter
        with:
          # Shared server concerns have Go coverage. Focus browser tests on
          # MCP App resources and the Go-to-client visualization integration.
          filters: |
            browser:
              - 'ui/**'
              - 'ui_*.go'
              - 'tools/app.go'
              - 'tools/query_datasource.go'
              - 'tools/viz_contract.go'
              - 'tools/ds_query.go'
              - 'tools/catalog.go'
              - 'go.mod'
              - 'go.sum'
              - 'mise.toml'
              - 'mise.lock'
              - '.github/actions/setup-mise/**'
              - '.github/workflows/browser-e2e.yml'
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          tools: go node
      - name: Build apps and MCP server on the runner
        env:
          CGO_ENABLED: "0"
        run: |
          mise run build-ui
          mise run build
      - name: Run browser contract tests in the pinned browser image
        run: |
          docker run --rm --init --ipc=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e CI=true \
            -e MCP_GRAFANA_BINARY=/work/dist/mcp-grafana \
            -v "$GITHUB_WORKSPACE:/work" -w /work/ui/mcp-apps \
            mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579 \
            npm run test:e2e
      - name: Retain browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-e2e-failure
          path: |
            ui/mcp-apps/test-results/
            ui/mcp-apps/playwright-report/
          retention-days: 14
