name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.check.outputs.is_tag }}
      version: ${{ steps.tag.outputs.version }}
      is_stable: ${{ steps.tag.outputs.is_stable }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - name: Check if tag push
        id: check
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Process tag name
        id: tag
        if: steps.check.outputs.is_tag == 'true'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Check if this is a stable release (no rc, alpha, beta, etc.)
          if [[ ! "$VERSION" =~ (rc|alpha|beta|pre|dev) ]]; then
            echo "is_stable=true" >> $GITHUB_OUTPUT
          else
            echo "is_stable=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine platforms
        id: platforms
        run: |
          # Only build multi-arch on pushes/tags/releases, not on PRs
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
          else
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          fi

  docker:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Build and Push to GAR (mirrored to Docker Hub)
        uses: grafana/shared-workflows/actions/docker-build-push-image@34f27887c37cafe70d34af57dfc86b468a31b8c4 # docker-build-push-image/v0.3.3
        id: build
        with:
          context: .
          file: ./Dockerfile
          # Keep GAR credentials for the signing steps below.
          gar-delete-credentials-file: "false"
          registries: gar
          gar-environment: prod
          gar-repository: dockerhub-mcp-grafana-prod-mirror
          platforms: ${{ needs.prepare.outputs.platforms }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.is_stable == 'true' && 'latest' || '' }}
            ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.version || '' }}
          push: ${{ needs.prepare.outputs.is_tag == 'true' }}

      # Keyless cosign signature and SPDX SBOM attestation for the pushed
      # image, stored alongside it in GAR. The shared build action has no SBOM
      # input, so the SBOM is generated from the pushed image instead.
      - name: Install cosign
        if: needs.prepare.outputs.is_tag == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate SBOM
        if: needs.prepare.outputs.is_tag == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.build.outputs.images }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign image and attest SBOM
        if: needs.prepare.outputs.is_tag == 'true'
        env:
          IMAGE: ${{ steps.build.outputs.images }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE"

      - name: Delete Google Application Credentials file
        if: always() && env.GOOGLE_APPLICATION_CREDENTIALS != ''
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

  docker-alpine:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Build and Push Alpine to GAR (mirrored to Docker Hub)
        uses: grafana/shared-workflows/actions/docker-build-push-image@34f27887c37cafe70d34af57dfc86b468a31b8c4 # docker-build-push-image/v0.3.3
        id: build
        with:
          context: .
          file: ./Dockerfile.alpine
          # Keep GAR credentials for the signing steps below.
          gar-delete-credentials-file: "false"
          registries: gar
          gar-environment: prod
          gar-repository: dockerhub-mcp-grafana-prod-mirror
          platforms: ${{ needs.prepare.outputs.platforms }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.is_stable == 'true' && 'alpine' || '' }}
            ${{ needs.prepare.outputs.is_tag == 'true' && format('{0}-alpine', needs.prepare.outputs.version) || '' }}
          push: ${{ needs.prepare.outputs.is_tag == 'true' }}

      # Keyless cosign signature and SPDX SBOM attestation for the pushed
      # image, stored alongside it in GAR. The shared build action has no SBOM
      # input, so the SBOM is generated from the pushed image instead.
      - name: Install cosign
        if: needs.prepare.outputs.is_tag == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate SBOM
        if: needs.prepare.outputs.is_tag == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.build.outputs.images }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-alpine.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign image and attest SBOM
        if: needs.prepare.outputs.is_tag == 'true'
        env:
          IMAGE: ${{ steps.build.outputs.images }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom-alpine.spdx.json "$IMAGE"

      - name: Delete Google Application Credentials file
        if: always() && env.GOOGLE_APPLICATION_CREDENTIALS != ''
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

  mcp-registry:
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          # Get the tag from the triggering workflow
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "No tag found at HEAD"
            exit 1
          fi
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT

      - name: Extract image tag from version
        id: image-tag
        run: |
          # Extract the image tag from the version
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "IMAGE_TAG=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Update server.json with Docker image
        run: |
          # Update the server.json with the correct Docker image reference
          # (note the image tag does not include the "v" prefix)
          jq --arg version "${{ steps.version.outputs.VERSION }}" \
            --arg image "docker.io/grafana/mcp-grafana:${{ steps.image-tag.outputs.IMAGE_TAG }}" \
             '.version = $version | .packages[0].identifier = $image' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Login to MCP Registry
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: mcp-publisher publish
