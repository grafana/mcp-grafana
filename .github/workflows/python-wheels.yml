name: Python wheel compatibility

on:
  push:
    branches: ["compat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel / ${{ matrix.os }} / Python 3.9 + 3.13 + 3.14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Build one host wheel with the modern build interpreter
        run: |
          bash scripts/build-python-wheels.sh 2.1.1 \
            --platforms "$(go env GOOS)-$(go env GOARCH)" \
            --output-dir dist/python-wheels

      # Reuse the same wheel without another Go build or artifact transfer.
      # A failed version does not skip the remaining versions.
      - name: Install and test on Python 3.9, 3.13 and 3.14
        run: |
          status=0
          for version in 3.9 3.13 3.14; do
            echo "::group::Python $version"
            (
              venv=".venv-wheel-$version"
              uv venv --python "$version" "$venv" || exit 1
              if [[ "$RUNNER_OS" == "Windows" ]]; then
                python="$venv/Scripts/python.exe"
              else
                python="$venv/bin/python"
              fi
              "$python" --version || exit 1
              "$python" -I scripts/test-python-wheel.py --self-test -v || exit 1
              # Normal dependency and Requires-Python resolution; no bypasses.
              uv pip install --python "$python" dist/python-wheels/*.whl || exit 1
              "$python" -I scripts/test-python-wheel.py -v
            ) || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Upload verified wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mcp-grafana-2.1.1-python39-${{ runner.os }}-${{ runner.arch }}
          path: dist/python-wheels/*.whl
          if-no-files-found: error
          retention-days: 14
