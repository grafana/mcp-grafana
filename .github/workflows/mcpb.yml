name: MCP Bundle

on:
  pull_request:
    paths:
      - "mcpb/**"
      - "scripts/build-mcpb.mjs"
      - ".goreleaser.yaml"
      - ".github/workflows/mcpb.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build MCP Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Tags, so the snapshot version reads 1.2.3-SNAPSHOT-<commit> rather
          # than 0.0.0-SNAPSHOT-<commit>.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
          # Caching a build that feeds a release artifact is a cache-poisoning
          # risk, as in the release workflow.
          cache: false

      # Only the binaries the bundle needs, including the universal macOS build.
      - name: Build binaries
        uses: goreleaser/goreleaser-action@01cbe076be10ba0af7b0b9319ac490a93d3d2fcd
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --id mcpb

      # Packing is the check: it validates the manifest, asserts the macOS binary
      # carries both architectures, and fails if the server reports no tools.
      - name: Pack bundle
        run: node scripts/build-mcpb.mjs

      # So the bundle can be installed and tried on a real machine before a
      # release ships it. Snapshot builds are labelled -SNAPSHOT-<commit>.
      - name: Upload bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mcp-grafana-mcpb
          path: dist/*.mcpb
          retention-days: 7
          if-no-files-found: error
