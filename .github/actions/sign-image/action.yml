name: Sign image and attest SBOMs
description: >-
  Keyless cosign signature for a pushed multi-arch image, plus one SPDX SBOM
  attestation per platform manifest. The shared docker-build-push-image action
  has no SBOM input, so the SBOMs are generated from the pushed image instead.
  Requires `id-token: write` and registry credentials that allow pushing.

inputs:
  images:
    description: Comma-separated image names (the build action's `images` output).
    required: true
  digest:
    description: Digest of the pushed image index.
    required: true
  platforms:
    description: Comma-separated platforms the image was built for, e.g. linux/amd64,linux/arm64.
    required: true

runs:
  using: composite
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Install syft
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

    - name: Sign image and attest SBOMs
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        DIGEST: ${{ inputs.digest }}
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        set -euo pipefail
        IFS=, read -ra images <<< "$IMAGES"
        IFS=, read -ra platforms <<< "$PLATFORMS"

        # Generate one SBOM per platform manifest. The digest is the same in
        # every registry, so scan the first image only.
        index=$(docker buildx imagetools inspect --raw "${images[0]}@$DIGEST")
        declare -A sboms
        for platform in "${platforms[@]}"; do
          pdigest=$(jq -r --arg os "${platform%%/*}" --arg arch "${platform#*/}" \
            '.manifests[]? | select(.platform.os == $os and .platform.architecture == $arch) | .digest' <<< "$index")
          # A single-platform push without attestations is a plain manifest.
          pdigest=${pdigest:-$DIGEST}
          sboms[$pdigest]="sbom-${platform//\//-}.spdx.json"
          syft "${images[0]}@$pdigest" -o "spdx-json=${sboms[$pdigest]}"
        done

        for image in "${images[@]}"; do
          cosign sign --yes "$image@$DIGEST"
          for pdigest in "${!sboms[@]}"; do
            cosign attest --yes --type spdxjson --predicate "${sboms[$pdigest]}" "$image@$pdigest"
          done
        done
