# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - go mod tidy

git:
  prerelease_suffix: "-rc"

builds:
  - id: default
    env:
      - CGO_ENABLED=0
    main: ./cmd/mcp-grafana
    goos:
      - linux
      - windows
      - darwin
    ldflags: "-s -w -X github.com/grafana/mcp-grafana.version={{.Version}}"
  - id: gemini-cli-extension
    env:
      - CGO_ENABLED=0
    main: ./cmd/mcp-grafana
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags: "-s -w -X github.com/grafana/mcp-grafana.version={{.Version}}"
  # Binaries for the MCP Bundle (.mcpb) consumed by Claude Desktop. The darwin
  # slices are merged into a single universal binary below, because MCPB manifests
  # can only vary the server command per OS, not per CPU architecture.
  # See https://github.com/modelcontextprotocol/mcpb/issues/10.
  - id: mcpb
    env:
      - CGO_ENABLED=0
    main: ./cmd/mcp-grafana
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on ARM runs the amd64 build under emulation.
      - goos: windows
        goarch: arm64
    ldflags: "-s -w -X github.com/grafana/mcp-grafana.version={{.Version}}"

universal_binaries:
  - id: mcpb-darwin-universal
    ids:
      - mcpb
    # Keep the per-arch binaries so the bundle can be inspected, and so nothing
    # else that consumes build id `mcpb` is affected.
    replace: false
    name_template: mcp-grafana

archives:
  - id: default
    ids:
      - default
    formats: tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: zip

  # The Gemini CLI Extension format.
  # See https://github.com/google-gemini/gemini-cli/blob/main/docs/extension-releasing.md#platform-specific-archives.
  # We'll use platform and architecture specific archive names, which must look like:
  #
  # {platform}.{arch}.{name}.{extension}
  #
  # Where the fields are:
  #
  # - {name}: The name of your extension.
  # - {platform}: The operating system. Supported values are:
  # -     darwin (macOS)
  # -     linux
  # -     win32 (Windows)
  # - {arch}: The architecture. Supported values are:
  # -     x64
  # -     arm64
  # - {extension}: The file extension of the archive (e.g., .tar.gz or .zip).
  #
  # Examples:
  # - darwin.arm64.{project}.tar.gz (specific to Apple Silicon Macs)
  # - linux.x64.{project}.tar.gz
  # - win32.{project}.zip
  - id: gemini-cli-extension
    ids:
      - gemini-cli-extension
    formats: tar.gz
    files:
      - gemini-extension.json
    name_template: >-
      {{ if eq .Os "windows" }}win32
      {{- else }}{{ .Os }}{{ end }}.
      {{- if eq .Arch "amd64" }}x64
      {{- else }}{{ .Arch }}{{ end }}.grafana
    format_overrides:
      - goos: windows
        formats: zip

changelog:
  # In CI, release notes are extracted from CHANGELOG.md and passed via
  # --release-notes, which overrides auto-generation entirely.
  # These filters are a fallback for local goreleaser runs.
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore\\(deps\\)"
